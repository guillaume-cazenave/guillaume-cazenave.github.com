  <div class="grid-container" id="grid"></div>

  <script src="./js/projects-data.js"></script>
  <script>
    const grid = document.getElementById('grid');
    let activeType = 'all';
    let activeCat  = 'all';

    function buildGrid() {
      grid.innerHTML = '';
      const filtered = PROJECTS.filter(p => {
        const typeOk = activeType === 'all' || p.type === activeType;
        const catOk  = activeCat  === 'all' || p.category === activeCat;
        return typeOk && catOk;
      });
      if (!filtered.length) {
        grid.innerHTML = '<p class="empty-msg">Aucun projet dans cette sélection.</p>';
        return;
      }
      // Featured en premier
      filtered.sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));
      filtered.forEach(p => {
        const item = document.createElement('div');
        item.className = 'grid-item';
        item.innerHTML = `<div class="grid-bg" style="background-image: url('${p.thumbnail}')"></div><div class="grid-overlay"></div><div class="grid-info"><span class="grid-title">${p.title}</span><span class="grid-year">${p.year}</span></div>`;

        // Fallback YouTube : si maxresdefault n'existe pas (image vide 120x90), on passe sur hqdefault
        if (p.thumbnail.indexOf('maxresdefault') !== -1) {
          const bg = item.querySelector('.grid-bg');
          const test = new Image();
          test.onload = function() {
            if (test.naturalWidth <= 120) {
              bg.style.backgroundImage = `url('${p.thumbnail.replace('maxresdefault', 'hqdefault')}')`;
            }
          };
          test.src = p.thumbnail;
        }
        item.addEventListener('click', () => window.location.href = p.addiktok ? 'addiktok.html' : `project-detail.html?id=${p.id}`);
        grid.appendChild(item);
      });
    }

    document.querySelectorAll('[data-type]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-type]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeType = btn.dataset.type;
        buildGrid();
      });
    });

    document.querySelectorAll('[data-cat]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-cat]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCat = btn.dataset.cat;
        buildGrid();
      });
    });

    const params  = new URLSearchParams(window.location.search);
    const urlType = params.get('type');
    const urlCat  = params.get('cat');
    if (urlType) {
      const btn = document.querySelector(`[data-type="${urlType}"]`);
      if (btn) btn.click(); else buildGrid();
    } else if (urlCat) {
      const btn = document.querySelector(`[data-cat="${urlCat}"]`);
      if (btn) btn.click(); else buildGrid();
    } else {
      buildGrid();
    }
  </script>
